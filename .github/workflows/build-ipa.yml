name: Build IPA for iPhone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode versions
        run: |
          xcodebuild -version
          ls /Applications/ | grep Xcode || true

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep '^Xcode_' | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "/Applications/$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build app (unsigned IPA for sideloading)
        run: |
          xcodebuild -project BabyFeeder.xcodeproj \
            -scheme BabyFeeder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BabyFeeder.app Payload/
          zip -r BabyFeeder.ipa Payload/
          ls -lh BabyFeeder.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyFeeder-iPhone
          path: BabyFeeder.ipa
          compression-level: 0
